<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORION | Autonomous Cloud Infrastructure & AI Orchestration</title>
    <!-- React & ReactDOM CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Chart.js CDN with fallbacks -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js" crossorigin="anonymous"></script>
    <script>
        if (typeof Chart === 'undefined') {
            document.write('<script src="https://unpkg.com/chart.js@4.4.1/dist/chart.umd.js"><\/script>');
        }
    </script>
    <!-- Google Fonts: Space Grotesk & Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #050505;
            --surface-primary: #0A0A0A;
            --surface-secondary: #111111;
            --surface-card: #151515;
            --surface-card-hover: #1A1A1A;
            
            --border-subtle: #262626;
            --border-light: rgba(255, 255, 255, 0.08);
            --border-active: rgba(255, 255, 255, 0.35);
            
            --text-primary: #FFFFFF;
            --text-secondary: #A1A1A1;
            --text-muted: #666666;
            --text-dim: #444444;
            
            --accent-silver: #E5E5E5;
            --accent-glow: rgba(255, 255, 255, 0.15);
            --accent-glow-strong: rgba(255, 255, 255, 0.35);
            
            --font-main: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-heading: 'Space Grotesk', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            
            --card-radius: 12px;
            --shadow-subtle: 0 8px 30px rgba(0, 0, 0, 0.7);
            --shadow-glass: 0 16px 48px rgba(0, 0, 0, 0.85);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-main);
            min-height: 100vh;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.04) 0%, transparent 65%),
                radial-gradient(circle at 100% 100%, rgba(255, 255, 255, 0.02) 0%, transparent 50%);
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
        }

        #root {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* --- TOP NAVIGATION BAR --- */
        .top-navbar {
            background: rgba(10, 10, 10, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 0.75rem 1.75rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            gap: 1rem;
        }

        .nav-left-group {
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }

        .brand-cluster {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            text-decoration: none;
        }

        .brand-vector {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            background: #111111;
            border: 1px solid var(--border-subtle);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.08);
            transition: all 0.3s ease;
        }

        .brand-cluster:hover .brand-vector {
            border-color: #FFFFFF;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.25);
        }

        .brand-title {
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 1.35rem;
            letter-spacing: 0.5px;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .brand-tag {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            padding: 0.15rem 0.45rem;
            background: var(--surface-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 4px;
            font-weight: 500;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Top Dropdown & Status Pills */
        .top-pills-row {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            flex-wrap: wrap;
        }

        .control-pill {
            background: var(--surface-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 6px;
            padding: 0.4rem 0.85rem;
            font-size: 0.78rem;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .control-pill:hover {
            background: var(--surface-card);
            border-color: var(--border-active);
            color: var(--text-primary);
        }

        .control-pill .pill-val {
            color: var(--text-primary);
            font-weight: 600;
        }

        .control-pill svg {
            width: 14px;
            height: 14px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 2;
        }

        .nav-right-group {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Minimalist Action Buttons */
        .btn-outline-minimal {
            background: transparent;
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            padding: 0.45rem 0.95rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-outline-minimal:hover {
            background: var(--surface-secondary);
            border-color: var(--border-active);
            color: var(--text-primary);
        }

        .btn-solid-white {
            background: var(--text-primary);
            border: 1px solid #FFFFFF;
            color: #000000;
            padding: 0.45rem 1.1rem;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.15);
        }

        .btn-solid-white:hover {
            background: #E5E5E5;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.35);
            transform: translateY(-1px);
        }

        .btn-icon-minimal {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            background: var(--surface-secondary);
            border: 1px solid var(--border-subtle);
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .btn-icon-minimal:hover {
            background: var(--surface-card);
            border-color: var(--border-active);
            color: var(--text-primary);
        }

        .indicator-dot-white {
            position: absolute;
            top: 6px;
            right: 6px;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #FFFFFF;
            box-shadow: 0 0 8px #FFFFFF;
        }

        .user-avatar-badge {
            width: 34px;
            height: 34px;
            border-radius: 6px;
            background: #111111;
            border: 1px solid var(--border-subtle);
            color: #FFFFFF;
            font-size: 0.75rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        /* --- APP SHELL: SIDEBAR + MAIN WORKSPACE --- */
        .app-shell {
            display: flex;
            flex: 1;
            min-height: calc(100vh - 61px);
        }

        /* Minimal Left Sidebar */
        .sidebar {
            width: 240px;
            background: var(--surface-primary);
            border-right: 1px solid var(--border-subtle);
            padding: 1.25rem 0.85rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 1.5rem;
            flex-shrink: 0;
        }

        .sidebar-section-title {
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-dim);
            font-weight: 600;
            padding: 0 0.65rem 0.5rem;
        }

        .sidebar-nav-list {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            list-style: none;
        }

        .sidebar-nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.55rem 0.75rem;
            border-radius: 6px;
            font-size: 0.84rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            border: 1px solid transparent;
        }

        .sidebar-nav-item:hover {
            background: var(--surface-secondary);
            color: var(--text-primary);
        }

        .sidebar-nav-item.active {
            background: var(--surface-secondary);
            border-color: var(--border-subtle);
            color: var(--text-primary);
            font-weight: 500;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }

        .sidebar-nav-item svg {
            width: 16px;
            height: 16px;
            stroke: var(--text-muted);
            fill: none;
            stroke-width: 1.75;
            transition: stroke 0.15s ease;
        }

        .sidebar-nav-item.active svg,
        .sidebar-nav-item:hover svg {
            stroke: var(--text-primary);
        }

        .sidebar-footer-card {
            background: var(--surface-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 0.85rem;
        }

        .sidebar-heartbeat {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 0.35rem;
        }

        .heartbeat-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #FFFFFF;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.8);
            animation: pulseGlow 2s infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.3); }
        }

        /* --- MAIN VIEW CONTAINER --- */
        .workspace {
            flex: 1;
            padding: 2rem 2.25rem;
            max-width: 1600px;
            width: 100%;
            margin: 0 auto;
            overflow-y: auto;
        }

        /* Hero Header Section */
        .hero-banner {
            margin-bottom: 2rem;
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1.25rem;
            border-bottom: 1px solid var(--border-subtle);
            padding-bottom: 1.5rem;
        }

        .hero-title {
            font-family: var(--font-heading);
            font-size: 1.95rem;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
            line-height: 1.2;
        }

        .hero-subtitle {
            font-size: 0.88rem;
            color: var(--text-secondary);
            margin-top: 0.35rem;
        }

        /* 6 Key Metric Cards Row */
        .metric-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .metric-card {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--card-radius);
            padding: 1.15rem 1.25rem;
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .metric-card:hover {
            background: var(--surface-card-hover);
            border-color: var(--border-active);
            transform: translateY(-2px);
            box-shadow: var(--shadow-subtle);
        }

        .metric-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.5rem;
            font-weight: 500;
        }

        .metric-card-val {
            font-family: var(--font-heading);
            font-size: 2rem;
            font-weight: 700;
            color: var(--text-primary);
            line-height: 1.1;
        }

        .metric-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 0.65rem;
            font-size: 0.72rem;
            color: var(--text-secondary);
        }

        .sparkline-svg {
            width: 75px;
            height: 22px;
            stroke: #A1A1A1;
            stroke-width: 1.5;
            fill: none;
        }

        /* --- SEAMLESS 3D INFRASTRUCTURE HERO STAGE --- */
        .stage-box {
            position: relative;
            background: #000000;
            border: 1px solid var(--border-subtle);
            border-radius: var(--card-radius);
            height: 600px;
            margin-bottom: 2rem;
            overflow: hidden;
            box-shadow: var(--shadow-glass);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .stage-fine-grid {
            position: absolute;
            inset: 0;
            background-size: 32px 32px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
            pointer-events: none;
            z-index: 2;
        }

        .isometric-viewport {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000000;
        }

        .isometric-render-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            filter: contrast(1.18) brightness(1.05) drop-shadow(0 0 50px rgba(255, 255, 255, 0.2));
            animation: floatTower 7s ease-in-out infinite;
            transition: all 0.4s ease;
        }

        @keyframes floatTower {
            0%, 100% { transform: translateY(0px) scale(1); filter: contrast(1.18) brightness(1.05) drop-shadow(0 0 45px rgba(255, 255, 255, 0.2)); }
            50% { transform: translateY(-10px) scale(1.015); filter: contrast(1.22) brightness(1.1) drop-shadow(0 0 65px rgba(255, 255, 255, 0.35)); }
        }

        .stage-scanner-laser {
            position: absolute;
            left: 10%;
            width: 80%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.95), transparent);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.9);
            animation: laserScanner 4.5s ease-in-out infinite;
            pointer-events: none;
            z-index: 10;
        }

        @keyframes laserScanner {
            0% { top: 8%; opacity: 0.1; }
            50% { top: 92%; opacity: 0.95; box-shadow: 0 0 25px rgba(255, 255, 255, 1); }
            100% { top: 8%; opacity: 0.1; }
        }

        /* Interactive Blade Node Hotspots */
        .node-hotspot-pin {
            position: absolute;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #FFFFFF;
            box-shadow: 0 0 18px rgba(255, 255, 255, 1);
            cursor: pointer;
            animation: pinPulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
            z-index: 35;
            transition: all 0.2s ease;
        }

        @keyframes pinPulse {
            0%, 100% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.5); opacity: 1; box-shadow: 0 0 28px #FFFFFF; }
        }

        /* SVG Hologram Callout Laser Line */
        .callout-vector-overlay {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 25;
        }

        .laser-path-dash {
            stroke-dasharray: 6, 6;
            animation: laserFlowPath 1.2s linear infinite;
        }

        @keyframes laserFlowPath {
            from { stroke-dashoffset: 24; }
            to { stroke-dashoffset: 0; }
        }

        /* Floating Dark Glassmorphism Overlay Panels */
        .floating-glass-card {
            background: rgba(10, 10, 10, 0.88);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--border-subtle);
            border-radius: var(--card-radius);
            padding: 1.15rem;
            box-shadow: var(--shadow-glass);
            position: absolute;
            z-index: 30;
            transition: all 0.25s ease;
            overflow: hidden;
        }

        .floating-glass-card::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent 45%,
                rgba(255, 255, 255, 0.04) 50%,
                transparent 55%
            );
            transform: rotate(25deg);
            animation: cardShimmer 10s linear infinite;
            pointer-events: none;
        }

        @keyframes cardShimmer {
            0% { transform: translate(-35%, -35%) rotate(25deg); }
            100% { transform: translate(35%, 35%) rotate(25deg); }
        }

        .floating-glass-card:hover {
            border-color: var(--border-active);
            transform: translateY(-2px);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.95);
        }

        .panel-top-left-1 { top: 24px; left: 24px; min-width: 175px; }
        .panel-top-left-2 { top: 120px; left: 24px; min-width: 175px; }
        .panel-traffic-left { bottom: 24px; left: 24px; width: 320px; }
        .panel-incident-right { top: 24px; right: 24px; width: 310px; }
        .panel-storage-right { bottom: 24px; right: 24px; width: 270px; }

        @media (max-width: 1200px) {
            .stage-box { height: auto; min-height: 560px; }
            .floating-glass-card { position: relative; inset: auto !important; width: 100% !important; margin-bottom: 1rem; }
            .app-shell { flex-direction: column; }
            .sidebar { width: 100%; border-right: none; border-bottom: 1px solid var(--border-subtle); }
        }

        /* Segmented Vertical Equalizer Frequency Bars */
        .equalizer-group {
            display: flex;
            gap: 2px;
            height: 32px;
            align-items: flex-end;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 2px;
            padding: 2px;
            margin-top: 0.4rem;
        }

        .equalizer-bar-unit {
            flex: 1;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 1px;
            transform-origin: bottom;
            animation: barBounce 1.4s ease-in-out infinite alternate;
        }

        .equalizer-bar-unit.active {
            background: #FFFFFF;
            box-shadow: 0 0 6px rgba(255, 255, 255, 0.4);
        }

        .equalizer-bar-unit:nth-child(2) { animation-delay: 0.15s; animation-duration: 1.1s; }
        .equalizer-bar-unit:nth-child(3) { animation-delay: 0.35s; animation-duration: 1.5s; }
        .equalizer-bar-unit:nth-child(4) { animation-delay: 0.1s; animation-duration: 0.9s; }
        .equalizer-bar-unit:nth-child(5) { animation-delay: 0.25s; animation-duration: 1.3s; }
        .equalizer-bar-unit:nth-child(6) { animation-delay: 0.45s; animation-duration: 1.4s; }

        @keyframes barBounce {
            0% { transform: scaleY(0.4); }
            50% { transform: scaleY(1.0); }
            100% { transform: scaleY(0.65); }
        }

        /* Incident Stream Item */
        .incident-stream-card {
            background: var(--surface-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 0.75rem 0.85rem;
            margin-bottom: 0.5rem;
        }

        .incident-badge-mono {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            text-transform: uppercase;
            padding: 0.15rem 0.4rem;
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: 3px;
            color: var(--text-primary);
            font-weight: 600;
        }

        /* --- 3 DATA GRIDS BOTTOM ROW --- */
        .three-column-grid {
            display: grid;
            grid-template-columns: 1.3fr 1fr 1.7fr;
            gap: 1.25rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 1100px) {
            .three-column-grid { grid-template-columns: 1fr; }
        }

        .section-card {
            background: var(--surface-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--card-radius);
            padding: 1.25rem 1.4rem;
            box-shadow: var(--shadow-subtle);
        }

        .section-card-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .section-heading-sm {
            font-family: var(--font-heading);
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        /* Monochrome Clean Data Table */
        .mono-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.78rem;
        }

        .mono-table th {
            text-align: left;
            color: var(--text-muted);
            font-weight: 500;
            padding: 0.5rem 0.6rem;
            border-bottom: 1px solid var(--border-subtle);
            text-transform: uppercase;
            font-size: 0.68rem;
            letter-spacing: 0.5px;
        }

        .mono-table td {
            padding: 0.65rem 0.6rem;
            color: var(--text-secondary);
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
            font-family: var(--font-mono);
        }

        .mono-table tr:hover td {
            background: rgba(255, 255, 255, 0.02);
            color: var(--text-primary);
        }

        /* Topology Network Tree */
        .topology-tree-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem 0.5rem;
            position: relative;
        }

        .topology-node-box {
            background: var(--surface-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            text-align: center;
            z-index: 2;
        }

        .topology-line-connector {
            position: absolute;
            top: 50%;
            left: 5%;
            right: 5%;
            height: 1px;
            background: var(--border-subtle);

        // --- MAIN APP COMPONENT ---
        function App() {
            const [activeTab, setActiveTab] = useState('overview');
            const [selectedModel, setSelectedModel] = useState('Random Forest');
            const [selectedRegion, setSelectedRegion] = useState('AWS-Asia-Jakarta');
            const [scaleMode, setScaleMode] = useState('Auto-Scale Active');
            const [autoPilot, setAutoPilot] = useState(true);
            const [toast, setToast] = useState(null);

            const [systemMetrics, setSystemMetrics] = useState({

            const [isAnomaly, setIsAnomaly] = useState(false);
            const [anomalyProbability, setAnomalyProbability] = useState(0.04);
            const [predictionLabel, setPredictionLabel] = useState('Normal');

            const [isOfflineFallback, setIsOfflineFallback] = useState(false);

            const [copilotQuery, setCopilotQuery] = useState('');

            const [vms, setVms] = useState([
                { id: 'VM-01', name: 'dc-web-01', status: 'Running', cpu: 28.5, memory: 42.1, region: 'AWS-AP', ip: '10.0.1.14', tx: '950 Kbps', rx: '110.5 kbps', cluster: 'CLUSTER-ALPHA' },
                { id: 'VM-02', name: 'dc-db-07', status: 'Running', cpu: 32.0, memory: 45.0, region: 'AWS-AP', ip: '10.0.2.88', tx: '2.3 Mbps', rx: '210.1 kbps', cluster: 'CLUSTER-ALPHA' },
                { id: 'VM-03', name: 'dc-cache-05', status: 'Running', cpu: 35.5, memory: 48.2, region: 'AWS-AP', ip: '10.0.3.104', tx: '1.0 Mbps', rx: '95.3 kbps', cluster: 'CLUSTER-BETA' },
                { id: 'VM-04', name: 'dc-api-02', status: 'Running', cpu: 22.4, memory: 38.0, region: 'AWS-US', ip: '10.0.4.12', tx: '1.8 Mbps', rx: '140.7 kbps', cluster: 'CLUSTER-BETA' },
                { id: 'VM-05', name: 'k8s-ingress-lb', status: 'Running', cpu: 24.1, memory: 36.5, region: 'AWS-EU', ip: '10.0.5.55', tx: '3.4 Mbps', rx: '420.0 kbps', cluster: 'CLUSTER-GAMMA' },
                { id: 'VM-06', name: 'worker-node-06', status: 'Running', cpu: 29.8, memory: 41.2, region: 'AWS-AP', ip: '10.0.1.99', tx: '820 Kbps', rx: '95.0 kbps', cluster: 'CLUSTER-GAMMA' },
                { id: 'VM-07', name: 'storage-sync', status: 'Running', cpu: 18.2, memory: 29.0, region: 'AWS-AP', ip: '10.0.7.20', tx: '1.2 Mbps', rx: '180.5 kbps', cluster: 'CLUSTER-DELTA' },
                { id: 'VM-08', name: 'kafka-broker-01', status: 'Running', cpu: 31.5, memory: 44.0, region: 'AWS-US', ip: '10.0.8.44', tx: '4.1 Mbps', rx: '650.2 kbps', cluster: 'CLUSTER-DELTA' },
                { id: 'VM-09', name: 'elastic-node-01', status: 'Running', cpu: 27.0, memory: 39.5, region: 'AWS-EU', ip: '10.0.1.201', tx: '1.9 Mbps', rx: '130.0 kbps', cluster: 'CLUSTER-EPSILON' },

                { id: 'VM-11', name: 'redis-tier-01', status: 'Running', cpu: 26.4, memory: 37.8, region: 'AWS-US', ip: '10.0.9.11', tx: '2.8 Mbps', rx: '310.4 kbps', cluster: 'CLUSTER-ZETA' },
                { id: 'VM-12', name: 'notify-engine', status: 'Running', cpu: 23.0, memory: 35.2, region: 'AWS-AP', ip: '10.0.4.77', tx: '620 Kbps', rx: '74.0 kbps', cluster: 'CLUSTER-ZETA' }
            ]);

            const [services, setServices] = useState([
                { name: 'Auth Gateway', status: 'HEALTHY', replicas: '4/4', latency: '12ms', cpu: '18%' },

                { name: 'Redis Cache Mesh', status: 'HEALTHY', replicas: '8/8', latency: '2ms', cpu: '15%' },
                { name: 'Postgres DB Master', status: 'HEALTHY', replicas: '2/2', latency: '16ms', cpu: '32%' },
                { name: 'Kafka Event Bus', status: 'HEALTHY', replicas: '5/5', latency: '11ms', cpu: '28%' },
                { name: 'Elastic Indexer', status: 'HEALTHY', replicas: '3/3', latency: '19ms', cpu: '22%' },
                { name: 'Notification Engine', status: 'HEALTHY', replicas: '4/4', latency: '14ms', cpu: '19%' },
                { name: 'Storage Sync Service', status: 'HEALTHY', replicas: '3/3', latency: '25ms', cpu: '17%' },
                { name: 'Analytics Processing', status: 'HEALTHY', replicas: '5/5', latency: '28ms', cpu: '31%' },
                { name: 'Worker Queue Cluster', status: 'HEALTHY', replicas: '6/6', latency: '15ms', cpu: '26%' },
                { name: 'ML Inference Service', status: 'HEALTHY', replicas: '4/4', latency: '18ms', cpu: '35%' },
                { name: 'Monitoring Collector', status: 'HEALTHY', replicas: '2/2', latency: '5ms', cpu: '12%' }
            ]);

            const [anomalyHistory, setAnomalyHistory] = useState([
                { id: 1, time: '02:45:10', node: 'VM-03', anomaly: 'Memory Saturation (94%)', action: 'Workload Redistribution & Container Restart', status: 'RESOLVED' },
                { id: 2, time: '02:22:45', node: 'VM-02', anomaly: 'High CPU Contention (>92%)', action: 'Autoscaled Compute Units & Thread Rebalance', status: 'RESOLVED' }
            ]);
            const [benchmarks, setBenchmarks] = useState([
                { model: 'Random Forest', accuracy: 0.985, f1: 0.982, precision: 0.988, recall: 0.976, latency: '4.2ms' },
                { model: 'XGBoost Classifier', accuracy: 0.978, f1: 0.975, precision: 0.981, recall: 0.969, latency: '5.8ms' },
                { model: 'Deep Neural Network', accuracy: 0.962, f1: 0.960, precision: 0.965, recall: 0.955, latency: '12.4ms' },
                { model: 'Isolation Forest (Baseline)', accuracy: 0.924, f1: 0.918, precision: 0.930, recall: 0.906, latency: '3.1ms' }
            ]);
            const [healingInProgress, setHealingInProgress] = useState(false);

            const showToast = (message) => {
                setToast(message);
                setTimeout(() => setToast(null), 3500);
            };

            // Initial API Calls
            useEffect(() => {
                fetch(`${API_BASE}/instances`)
                    .then(res => res.json())
                    .then(data => {
                        if (Array.isArray(data) && data.length) setVms(data);
                        else if (data && Array.isArray(data.instances)) setVms(data.instances);
                    }).catch(() => {});

                fetch(`${API_BASE}/benchmarks`)
                    .then(res => res.json())
                    .then(data => {
                        if (Array.isArray(data) && data.length) setBenchmarks(data);
                        else if (data && Array.isArray(data.models)) setBenchmarks(data.models);
                    }).catch(() => {});

                fetch(`${API_BASE}/logs`)
                    .then(res => res.json())
                    .then(data => {
                        if (Array.isArray(data) && data.length) setAnomalyHistory(data);
                        else if (data && Array.isArray(data.logs) && data.logs.length) setAnomalyHistory(data.logs);
                    }).catch(() => {});
            }, []);

            // Polling Current Telemetry
            useEffect(() => {
                const interval = setInterval(() => {
                    if (!healingInProgress && activeTab !== 'settings') {
                        fetch(`${API_BASE}/metrics/current`)
                            .then(res => res.json())
                            .then(data => {
                                if (data && data.status === 'success' && data.metrics) {
                                    setSystemMetrics({
                                        cpu: parseFloat(data.metrics.cpu || 0),
                                        memory: parseFloat(data.metrics.memory || 0),
                                        latency: parseFloat(data.metrics.latency || 0),
                                        disk: parseFloat(data.metrics.disk || 0)
                                    });
                                }
                            })
                            .catch(() => {
                                setSystemMetrics(prev => ({
                                    cpu: Math.min(99, Math.max(8, prev.cpu + (Math.random() * 3 - 1.5))),
                                    memory: Math.min(98, Math.max(20, prev.memory + (Math.random() * 2 - 1))),
                                    latency: Math.min(300, Math.max(5, prev.latency + (Math.random() * 6 - 3))),
                                    disk: Math.min(100.0, Math.max(0.0, prev.disk + (Math.random() * 0.1 - 0.05)))
                                }));
                            });
                    }
                }, 2000);
                return () => clearInterval(interval);
            }, [healingInProgress, activeTab]);

            // Real ML Anomaly Prediction Inference
            useEffect(() => {
                fetch(`${API_BASE}/predict`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        cpu: systemMetrics.cpu,
                        memory: systemMetrics.memory,
                        latency: systemMetrics.latency,
                        disk: systemMetrics.disk,
                        model: selectedModel
                    })
                })
                .then(res => {
                    if (!res.ok) throw new Error(`HTTP ${res.status}`);
                    return res.json();
                })
                .then(data => {
                    setIsOfflineFallback(false);
                    if (data && data.is_anomaly !== undefined) {
                        setIsAnomaly(Boolean(data.is_anomaly));
                        setPredictionLabel(data.prediction_label || (data.is_anomaly ? 'Anomaly' : 'Normal'));
                        setAnomalyProbability(data.anomaly_probability !== undefined ? data.anomaly_probability : (data.is_anomaly ? 0.95 : 0.05));
                        setPredictionConfidence(data.confidence !== undefined ? data.confidence : 0.95);
                        setHealingTriggered(Boolean(data.healing_triggered));
                        setHealingStatus(data.healing_status || (data.is_anomaly ? 'executed' : 'nominal'));
                        if (data.rca !== undefined) setBackendRca(data.rca);
                        if (data.healing_error !== undefined) setHealingError(data.healing_error);
                        else if (!data.is_anomaly) setHealingError(null);
                    }
                })
                .catch(() => {
                    setIsOfflineFallback(true);
                    let score = 0;
                    if (systemMetrics.cpu > 75) score += 0.45;
                    if (systemMetrics.memory > 80) score += 0.40;
                    if (systemMetrics.latency > 150) score += 0.35;
                    if (systemMetrics.disk > 85) score += 0.25;

                    const prob = Math.min(0.99, Math.max(0.02, score));
                    setAnomalyProbability(prob);
                    const anomalyDetected = prob > 0.5;
                    setIsAnomaly(anomalyDetected);
                    setPredictionLabel(anomalyDetected ? 'Anomaly (Offline Fallback)' : 'Normal (Offline Fallback)');
                    setPredictionConfidence(0.50);
                    setHealingTriggered(false);
                    setHealingStatus(anomalyDetected ? 'active_remediation_in_progress' : 'nominal');
                });
            }, [systemMetrics, selectedModel]);

            // Auto-Pilot Remediation Guard
            useEffect(() => {
                const isAlreadyRemediating = healingTriggered || healingStatus === 'executed' || healingStatus === 'active_remediation_in_progress';
                if (autoPilot && isAnomaly && !healingInProgress && !isAlreadyRemediating && activeTab !== 'settings') {
                    const timer = setTimeout(() => {
                        triggerAutoHeal(anomalyCause);
                    }, 3500);
                    return () => clearTimeout(timer);
                }
            }, [autoPilot, isAnomaly, healingInProgress, healingTriggered, healingStatus, anomalyCause, activeTab]);

            // Fault Injection
            const triggerAnomalyInjection = (type) => {
                fetch(`${API_BASE}/inject`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ type: type.toUpperCase() })
                })
                .then(res => res.json())
                .then(data => {
                    const cause = data.cause || 'Resource Contention';
                    const metrics = data.metrics || { cpu: 98.5, memory: 88.2, latency: 220.0, disk: 45.0 };
                    setAnomalyCause(cause);
                    setSystemMetrics({
                        cpu: parseFloat(metrics.cpu || 98.5),
                        memory: parseFloat(metrics.memory || 88.2),
                        latency: parseFloat(metrics.latency || 220.0),
                        disk: parseFloat(metrics.disk || 45.0)
                    });
                    showToast(`Anomaly Injected: ${cause}`);
                })
                .catch(() => {
                    setAnomalyCause('CPU Throttling (>90%)');
                    setSystemMetrics({ cpu: 98.5, memory: 88.2, latency: 220.0, disk: 45.0 });
                    showToast('Anomaly Injected: CPU Throttling (>90%)');
                });
            };

            // Autonomous Self-Healing Execution
            const triggerAutoHeal = (cause) => {
                const healCause = cause || anomalyCause || 'Manual Remediation';
                setHealingInProgress(true);
                showToast(`Executing Autonomous Self-Healing: ${healCause}...`);

                fetch(`${API_BASE}/heal`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ target_node: 'All Nodes', anomaly_trigger: healCause, status: 'Anomaly' })
                })
                .then(res => res.json())
                .then(data => {
                    setHealingInProgress(false);
                    setIsAnomaly(false);
                    setPredictionLabel('Normal');
                    setHealingStatus('nominal');
                    setHealingTriggered(false);
                    setBackendRca(null);
                    setHealingError(null);
                    if (data && data.restored_metrics) {
                        setSystemMetrics({
                            cpu: parseFloat(data.restored_metrics.cpu || 22.0),
                            memory: parseFloat(data.restored_metrics.memory || 38.0),
                            latency: parseFloat(data.restored_metrics.latency || 12.0),
                            disk: parseFloat(data.restored_metrics.disk || 15.0)
                        });
                    } else {
                        setSystemMetrics({ cpu: 22.0, memory: 38.0, latency: 12.0, disk: 15.0 });
                    }
                    fetch(`${API_BASE}/logs`)
                        .then(res => res.json())
                        .then(logs => {
                            if (Array.isArray(logs) && logs.length) setAnomalyHistory(logs);
                            else if (logs && Array.isArray(logs.logs) && logs.logs.length) setAnomalyHistory(logs.logs);
                        }).catch(() => {});
                    showToast('Self-Healing Completed. Infrastructure nominal.');
                })
                .catch(() => {
                    setSystemMetrics({ cpu: 22.0, memory: 38.0, latency: 12.0, disk: 15.0 });
                    setIsAnomaly(false);
                    setPredictionLabel('Normal');
                    setHealingStatus('nominal');
                    setHealingTriggered(false);
                    setBackendRca(null);
                    setHealingInProgress(false);
                    showToast('Self-Healing Completed (Fallback).');
                });
            };

            const handleCopilotSubmit = (e) => {
                e.preventDefault();
                if (!copilotQuery.trim()) return;
                const userMsg = copilotQuery;
                setCopilotMessages(prev => [...prev, { sender: 'User', text: userMsg }]);
                setCopilotQuery('');
                
                setTimeout(() => {
                    let aiReply = `ORION AI Analysis for "${userMsg}": Telemetry indicates CPU is at ${systemMetrics.cpu.toFixed(1)}%, RAM at ${systemMetrics.memory.toFixed(1)}%. Model classification is ${predictionLabel}. No critical action required.`;
                    if (userMsg.toLowerCase().includes('heal') || userMsg.toLowerCase().includes('remediate')) {
                        triggerAutoHeal('AI Copilot Direct Request');
                        aiReply = 'Triggered immediate cluster-wide autonomous self-healing.';
                    } else if (userMsg.toLowerCase().includes('cpu') || userMsg.toLowerCase().includes('spike')) {
                        aiReply = `CPU utilization is currently ${systemMetrics.cpu.toFixed(1)}%. Recommendation: Maintain auto-scaling parameters across ${selectedRegion}.`;
                    }
                    setCopilotMessages(prev => [...prev, { sender: 'ORION AI', text: aiReply }]);
                }, 600);
            };

            return (
                <React.Fragment>
                    {/* TOP NAVIGATION BAR */}
                    <header className="top-navbar">

                            </div>

                            <div className="top-pills-row">
                                <div className="control-pill" onClick={() => {
                                    const regions = ['AWS-Asia-Jakarta', 'US-East-1', 'EU-Central-1', 'AP-South-1'];

                                    showToast(`Region context: ${next}`);

                                    <span>Region: <span className="pill-val">{selectedRegion}</span></span>
                                    <Icons.ChevronDown />

                                    <span>Nodes: <span className="pill-val">{vms.filter(v => v.status === 'Running').length} Online / {vms.filter(v => v.status !== 'Running').length} Standby</span></span>
                                    <Icons.ChevronDown />
                                </div>

                                <div className="control-pill" onClick={() => {
                                    const modes = ['Auto-Scale Active', 'Manual Fixed', 'AIOps Autonomous'];
                                    const next = modes[(modes.indexOf(scaleMode) + 1) % modes.length];

        // --- COMPONENT: MONOCHROME CONTAINER THROUGHPUT CHART ---
        function MonochromeContainerChart({ metrics }) {
            const canvasRef = useRef(null);
            const chartRef = useRef(null);

            useEffect(() => {
                if (!canvasRef.current) return;
                const canvas = canvasRef.current;
                
                if (window.Chart && Chart.getChart(canvas)) {
                    Chart.getChart(canvas).destroy();
                }

                const ctx = canvas.getContext('2d');
                const gradient = ctx.createLinearGradient(0, 0, 0, 120);
                gradient.addColorStop(0, 'rgba(255, 255, 255, 0.25)');
                gradient.addColorStop(1, 'rgba(255, 255, 255, 0.0)');

                chartRef.current = new Chart(ctx, {
                    type: 'line',
                    data: {
                        labels: ['00:09', '00:10', '00:11', '00:12', '00:13'],
                        datasets: [
                            {
                                label: 'Throughput',
                                data: [65, 110, 80, 135, Math.min(195, Math.max(50, metrics.cpu * 2))],
                                borderColor: '#FFFFFF',
                                backgroundColor: gradient,
                                fill: true,
                                tension: 0.35,
                                borderWidth: 1.5,
                                pointRadius: 0
                            }
                        ]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        plugins: { legend: { display: false } },
                        scales: {
                            y: {
                                min: 0,
                                max: 200,
                                ticks: {
                                    stepSize: 100,
                                    callback: v => `${v} GB`,
                                    color: '#666666',
                                    font: { size: 9, family: 'Inter' }
                                },
                                grid: { color: 'rgba(255, 255, 255, 0.04)' }
                            },
                            x: {
                                ticks: { color: '#666666', font: { size: 9, family: 'Inter' } },
                                grid: { display: false }
                            }
                        }
                    }
                });

                return () => {
                    if (chartRef.current) chartRef.current.destroy();
                };
            }, [metrics]);

            return <canvas ref={canvasRef} />;
        }

        // Mount React Root
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
