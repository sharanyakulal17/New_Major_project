<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AURA-LOAD | Traffic Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Header -->
        <header>
            <div>
                <h1>AURA-LOAD</h1>
                <p>Traffic Generator Dashboard</p>
            </div>

            <div class="status">
                <span id="statusDot"></span>
                <span id="statusText">Idle</span>
            </div>
        </header>

        <!-- Load Type Navigation -->
<section class="card">

    <h2>Load Type</h2>

    <div class="buttons">

        <button onclick="location.href='index.html'">
            CPU LOAD
        </button>

        <button onclick="location.href='memory-load.html'">
            MEMORY LOAD
        </button>

        <button onclick="location.href='disk-load.html'">
            DISK LOAD
        </button>

        <button onclick="location.href='response-load.html'">
            RESPONSE TIME
        </button>

    </div>

</section>

        <!-- Control Panel -->
        <section class="card">

            <h2>Load Configuration</h2>

            <div class="form-grid">

                <div class="input-group">
                    <label for="targetUrl">Target URL</label>
                    <input
                        type="text"
                        id="targetUrl"
                        value="http://127.0.0.1:5001"
                    >
                </div>

                <div class="input-group">
                    <label for="trafficLoad">
                        Traffic Requests Per Minute
                    </label>

                    <input
                        type="number"
                        id="trafficLoad"
                        value="1200"
                        min="0"
                    >
                </div>

                <div class="input-group">
                    <label for="duration">Duration (seconds)</label>

                    <input
                        type="number"
                        id="duration"
                        value="30"
                        min="1"
                    >
                </div>

            </div>


            <div class="buttons">

                <button id="startBtn" class="start-btn">
                    START LOAD
                </button>

                <button id="stopBtn" class="stop-btn" disabled>
                    STOP LOAD
                </button>

            </div>

        </section>


        <!-- Statistics -->
        <section class="stats-grid">

            <div class="stat-card">
                <h3>Requests Sent</h3>
                <p id="requestsSent">0</p>
            </div>

            <div class="stat-card">
                <h3>Successful</h3>
                <p id="successfulRequests">0</p>
            </div>

            <div class="stat-card">
                <h3>Failed</h3>
                <p id="failedRequests">0</p>
            </div>

            <div class="stat-card">
                <h3>Average Response</h3>
                <p id="responseTime">0 ms</p>
            </div>

        </section>


        <!-- Traffic Information -->
        <section class="card">

            <h2>Traffic Information</h2>

            <div class="traffic-info">

                <div>
                    <span>Current Load</span>
                    <strong id="currentLoad">0 req/s</strong>
                </div>

                <div>
                    <span>Total Requests</span>
                    <strong id="totalRequests">0</strong>
                </div>

                <div>
                    <span>Elapsed Time</span>
                    <strong id="elapsedTime">0 sec</strong>
                </div>

            </div>

        </section>


        <!-- Footer -->
        <footer>
            <p>AURA-LOAD • Traffic Generator for AURA-HEAL</p>
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
