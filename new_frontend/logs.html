<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>NEBULA CORE | Logs</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI", Arial, sans-serif;
}

body{
    background:#0b1220;
    color:#e5edf5;
    min-height:100vh;
    overflow:hidden;
    letter-spacing:0.01em;
}

/* HEADER */

.header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 70px;
    background: #0e1725;
    border-bottom: 1px solid #1a2c3f;
    display: flex;
    align-items: center;
    padding: 0 30px;
    z-index: 10000;
}

.logo-area{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{
    font-size:24px;
    font-weight:700;
    letter-spacing:0.08em;
    color:#98d9ff;
}

.logo span {
    color:#f2f7fb;
}

/* NAV */

.navbar{
    position:fixed;
    top:70px;
    left:0;
    right:0;
    height:55px;
    background:rgba(14, 23, 37, 0.96);
    border-bottom:1px solid #1a2c3f;
    display:flex;
    align-items:center;
    justify-content:flex-start;
    padding:0 30px;
    gap:12px;
    z-index:9999;
}

.nav-links {
    display:flex;
    align-items:center;
    gap:8px;
    min-width:0;
    flex:1;
    flex-wrap:nowrap;
    white-space:nowrap;
}

.navbar a{
    text-decoration:none;
    color:#9aaac0;
    padding:9px 14px;
    border-radius:6px;
    font-size:13px;
    font-weight:600;
    transition:all 0.2s ease;
    white-space:nowrap;
    flex-shrink:0;
}

.navbar a:hover,
.navbar a.active{
    background:#1a2f42;
    color:#dfefff;
}

.nav-search {
    display:flex;
    align-items:center;
    gap:8px;
    background: rgba(7, 17, 31, 0.9);
    border:1px solid #233a52;
    border-radius:8px;
    padding:5px 8px 5px 12px;
    min-width:min(380px, 32vw);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.02);
    margin-left:auto;
}

.nav-search input {
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:white;
    font-size:13px;
    min-width:0;
}

.nav-search input::placeholder {
    color:#7d92aa;
}

.nav-search button {
    border:none;
    background:linear-gradient(135deg, #00a8c7, #00d9ff);
    color:#041521;
    padding:8px 12px;
    border-radius:6px;
    font-size:12px;
    font-weight:bold;
    cursor:pointer;
}

/* MAIN */

.main {
    position: fixed;
    top: 125px;
    left: 0;
    right: 0;
    bottom: 0;
    padding: 20px 30px;
    overflow-y: auto;
    overflow-x: hidden;
}

.page-title{
    margin-bottom:18px;
}

.page-title h2{
    font-size:28px;
    margin-bottom:7px;
    font-weight:700;
    letter-spacing:-0.02em;
    color:#f1f7ff;
}

.page-title p{
    color:#8d9eb3;
    font-size:14px;
}

/* LOGS */

.logs-card{
    background:#0c1a2a;
    border:1px solid #1b3148;
    border-radius:15px;
    padding:20px;
}

.log{
    padding:15px;
    border-bottom:1px solid #172a3e;
    font-size:13px;
    color:#a9bbcc;
}

.log:last-child{
    border-bottom:none;
}

.log-time{
    color:#00d9ff;
    margin-right:10px;
}

.empty{
    text-align:center;
    padding:40px;
    color:#8193a8;
}

</style>

</head>

<body>


<!-- HEADER -->

<header class="header">

    <div class="logo-area">

        <div class="logo">
            NEBULA <span>CORE</span>
        </div>

    </div>

</header>


<!-- NAVIGATION -->

<nav class="navbar">
    <div class="nav-links">
        <a href="./index3.html">
            Dashboard
        </a>

        <a href="./graphs.html">
            Graphs
        </a>

        <a href="./logs.html"
           class="active">
            Logs
        </a>

        <a href="./system-information.html">
            System Information
        </a>

        <a href="./vm.html">
            VM
        </a>
    </div>

    <div class="nav-search">
        <input type="search" placeholder="Search logs, events..." aria-label="Search logs">
        <button type="button">Search</button>
    </div>
</nav>


<!-- MAIN -->

<main class="main">

    <div class="page-title">

        <h2>
            System Logs
        </h2>

        <p>
            NEBULA CORE system activity and recovery logs
        </p>

    </div>


    <div class="logs-card">

        <div id="logsContainer">

            <div class="empty">
                Loading logs...
            </div>

        </div>

    </div>

</main>


<script>

const API =
    "http://127.0.0.1:5001/api/v1";

function handleNavSearch() {
    const input = document.querySelector(".nav-search input");
    if (!input) return;

    const query = input.value.trim().toLowerCase();
    if (!query) {
        input.focus();
        return;
    }

    const searchableElements = Array.from(
        document.querySelectorAll(".page-title h2, .page-title p, .log, .empty")
    );

    let match = null;
    for (const element of searchableElements) {
        if (element.textContent.toLowerCase().includes(query)) {
            match = element;
            break;
        }
    }

    if (!match) {
        alert("No matching log entry found.");
        return;
    }

    searchableElements.forEach(el => {
        el.style.outline = "none";
        el.style.outlineOffset = "0";
    });

    match.scrollIntoView({ behavior: "smooth", block: "center" });
    match.style.outline = "2px solid #00d9ff";
    match.style.outlineOffset = "4px";

    setTimeout(() => {
        match.style.outline = "none";
        match.style.outlineOffset = "0";
    }, 1800);
}

const navSearchInput = document.querySelector(".nav-search input");
const navSearchButton = document.querySelector(".nav-search button");

if (navSearchButton) {
    navSearchButton.addEventListener("click", handleNavSearch);
}

if (navSearchInput) {
    navSearchInput.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            handleNavSearch();
        }
    });
}

async function loadLogs(){

    const container =
        document.getElementById(
            "logsContainer"
        );


    try{

        const response =
            await fetch(
                `${API}/logs`
            );


        const data =
            await response.json();


        const logs =
            Array.isArray(data.logs) ? data.logs : [];


        if(logs.length === 0){

            container.innerHTML =
                `<div class="empty">
                    No logs available
                </div>`;

            return;

        }


        container.innerHTML =
            logs.map(log => {

                const item =
                    typeof log === "string"
                        ? { raw: log }
                        : log || {};

                const time =
                    item.timestamp || item.time || item.createdAt || "";

                const status =
                    item.status || "INFO";

                const node =
                    item.node ? `[${item.node}] ` : "";

                const action =
                    item.action || item.raw || item.message || item.prediction || "System event";

                const prediction =
                    item.prediction || item.anomaly || "";

                const message =
                    prediction && prediction !== action
                        ? `${prediction} | ${action}`
                        : action;

                return `
                    <div class="log">
                        <span class="log-time">
                            ${time}
                        </span>
                        <span>
                            <strong>${status}</strong>
                            ${node}${message}
                        </span>
                    </div>
                `;

            }).join("");

    }
    catch(error){

        console.log(
            "Logs error:",
            error
        );


        container.innerHTML =
            `<div class="empty">
                Unable to load logs
            </div>`;

    }

}


loadLogs();

setInterval(
    loadLogs,
    5000
);

</script>

</body>
</html>
