<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEBULA CORE - Graphs</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #0b1220;
            color: #e5edf5;
            min-height: 100vh;
            overflow-x: hidden;
            overflow-y: auto;
            letter-spacing: 0.01em;
        }

        /* ================= HEADER ================= */

        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: #0e1725;
            border-bottom: 1px solid #1a2c3f;
            display: flex;
            align-items: center;
            padding: 0 30px;
            z-index: 10000;
        }

        .logo {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 0.08em;
            color: #98d9ff;
        }

        .logo span {
            color: #f2f7fb;
        }

        /* ================= NAVIGATION ================= */

        .navbar {
            position: fixed;
            top: 70px;
            left: 0;
            right: 0;
            height: 55px;
            background: rgba(14, 23, 37, 0.96);
            border-bottom: 1px solid #1a2c3f;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 30px;
            gap: 12px;
            z-index: 9999;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: nowrap;
            white-space: nowrap;
        }

        .navbar a {
            text-decoration: none;
            color: #9aaac0;
            padding: 9px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            transition: all 0.2s ease;
            white-space: nowrap;
            flex-shrink: 0;
        }

        .navbar a:hover {
            background: #17283c;
            color: #edf5ff;
        }

        .navbar a.active {
            background: #1a2f42;
            color: #dfefff;
        }

        .nav-search {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(7, 17, 31, 0.9);
            border: 1px solid #233a52;
            border-radius: 8px;
            padding: 5px 8px 5px 12px;
            min-width: min(380px, 32vw);
            flex-shrink: 0;
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.02);
        }

        .nav-search input {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 13px;
            min-width: 0;
        }

        .nav-search input::placeholder {
            color: #7d92aa;
        }

        .nav-search button {
            border: none;
            background: linear-gradient(135deg, #00a8c7, #00d9ff);
            color: #041521;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }

        /* ================= MAIN ================= */

        .main {
            position: relative;
            top: 125px;
            left: 0;
            right: 0;
            padding: 20px 30px 40px;
            overflow: visible;
            min-height: calc(100vh - 125px);
        }

        .page-title {
            font-size: 25px;
            margin-bottom: 5px;
        }

        .page-subtitle {
            color: #8fa3b8;
            font-size: 14px;
            margin-bottom: 18px;
        }

        /* ================= GRAPH GRID ================= */

        .graphs-grid {
            width: 100%;
            min-height: 760px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 18px;
        }

        /* ================= GRAPH CARD ================= */

        .graph-card {
            background: #0b1728;
            border: 1px solid #1d3048;
            border-radius: 10px;

            padding: 18px;
            min-height: 290px;
            height: 100%;
            box-shadow: inset 0 0 0 1px rgba(117, 148, 192, 0.08);

            display: flex;
            flex-direction: column;
        }

        .graph-title {
            display: flex;
            justify-content: space-between;
            align-items: center;

            margin-bottom: 10px;
        }

        .graph-title h3 {
            font-size: 16px;
        }

        .status {
            font-size: 11px;
            color: #00d9ff;
            background: #092b38;
            padding: 5px 9px;
            border-radius: 5px;
        }

        .chart-container {
            position: relative;
            flex: 1;
            width: 100%;
            height: 260px;
            min-height: 260px;
        }

        canvas {
            width: 100% !important;
            height: 100% !important;
        }

        /* ================= RESPONSIVE ================= */

        @media (max-width: 800px) {

            body {
                overflow: auto;
            }

            .main {
                position: relative;
                top: 125px;
                padding-bottom: 30px;
                overflow: visible;
            }

            .graphs-grid {
                height: auto;

                grid-template-columns: 1fr;
                grid-template-rows: repeat(4, 300px);
            }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="header">
        <div class="logo">
            NEBULA<span> CORE</span>
        </div>
    </header>

    <!-- NAVIGATION -->
    <nav class="navbar">
        <div class="nav-links">
            <a href="./index3.html">Dashboard</a>
            <a href="./graphs.html" class="active">Graphs</a>
            <a href="./logs.html">Logs</a>
            <a href="./system-information.html">System Information</a>
            <a href="./vm.html">VM</a>
        </div>

        <div class="nav-search">
            <input type="search" placeholder="Search graphs, metrics..." aria-label="Search system">
            <button type="button">Search</button>
        </div>
    </nav>

    <!-- MAIN -->
    <main class="main">

        <h1 class="page-title">System Graphs</h1>

        <p class="page-subtitle">
            Real-time system performance monitoring
        </p>

        <div class="graphs-grid">

            <!-- CPU -->
            <div class="graph-card">

                <div class="graph-title">
                    <h3>CPU Usage</h3>
                    <span class="status">LIVE</span>
                </div>

                <div class="chart-container">
                    <canvas id="cpuChart"></canvas>
                </div>

            </div>

            <!-- MEMORY -->
            <div class="graph-card">

                <div class="graph-title">
                    <h3>Memory Usage</h3>
                    <span class="status">LIVE</span>
                </div>

                <div class="chart-container">
                    <canvas id="memoryChart"></canvas>
                </div>

            </div>

            <!-- DISK -->
            <div class="graph-card">

                <div class="graph-title">
                    <h3>Disk Usage</h3>
                    <span class="status">LIVE</span>
                </div>

                <div class="chart-container">
                    <canvas id="diskChart"></canvas>
                </div>

            </div>

            <!-- NETWORK -->
            <div class="graph-card">

                <div class="graph-title">
                    <h3>Network / Response Time</h3>
                    <span class="status">LIVE</span>
                </div>

                <div class="chart-container">
                    <canvas id="networkChart"></canvas>
                </div>

            </div>

        </div>

    </main>

    <script>

        const API = "http://127.0.0.1:5001/api/v1";

        let labels = [];

        let cpuData = [];
        let memoryData = [];
        let diskData = [];
        let networkData = [];

        let cpuChart;
        let memoryChart;
        let diskChart;
        let networkChart;


        /* ================= CHART OPTIONS ================= */

        function chartOptions(label, max = 100) {

            return {

                responsive: true,

                maintainAspectRatio: false,

                animation: false,

                plugins: {
                    legend: {
                        display: true,
                        labels: {
                            color: "#8fa3b8"
                        }
                    }
                },

                scales: {

                    x: {
                        ticks: {
                            color: "#71859b"
                        },

                        grid: {
                            color: "#17283c"
                        }
                    },

                    y: {

                        min: 0,
                        max: max,

                        ticks: {
                            color: "#71859b"
                        },

                        grid: {
                            color: "#17283c"
                        }
                    }

                }

            };
        }


        /* ================= CREATE CHARTS ================= */

        function createCharts() {

            cpuChart = new Chart(
                document.getElementById("cpuChart"),
                {
                    type: "line",

                    data: {
                        labels: labels,

                        datasets: [{
                            label: "CPU %",
                            data: cpuData,
                            borderColor: "#39d0ff",
                            backgroundColor: "rgba(57, 208, 255, 0.16)",
                            borderWidth: 3,
                            tension: 0.35,
                            pointRadius: 3,
                            pointBackgroundColor: "#7ce7ff",
                            pointBorderColor: "#39d0ff",
                            fill: true
                        }]
                    },

                    options: chartOptions("CPU", 100)
                }
            );


            memoryChart = new Chart(
                document.getElementById("memoryChart"),
                {
                    type: "line",

                    data: {
                        labels: labels,

                        datasets: [{
                            label: "Memory %",
                            data: memoryData,
                            borderColor: "#7bf0a8",
                            backgroundColor: "rgba(123, 240, 168, 0.16)",
                            borderWidth: 3,
                            tension: 0.35,
                            pointRadius: 3,
                            pointBackgroundColor: "#bafad1",
                            pointBorderColor: "#7bf0a8",
                            fill: true
                        }]
                    },

                    options: chartOptions("Memory", 100)
                }
            );


            diskChart = new Chart(
                document.getElementById("diskChart"),
                {
                    type: "line",

                    data: {
                        labels: labels,

                        datasets: [{
                            label: "Disk %",
                            data: diskData,
                            borderColor: "#ffbf69",
                            backgroundColor: "rgba(255, 191, 105, 0.16)",
                            borderWidth: 3,
                            tension: 0.35,
                            pointRadius: 3,
                            pointBackgroundColor: "#ffd89d",
                            pointBorderColor: "#ffbf69",
                            fill: true
                        }]
                    },

                    options: chartOptions("Disk", 100)
                }
            );


            networkChart = new Chart(
                document.getElementById("networkChart"),
                {
                    type: "line",

                    data: {
                        labels: labels,

                        datasets: [{
                            label: "Response Time (ms)",
                            data: networkData,
                            borderColor: "#ff6bb5",
                            backgroundColor: "rgba(255, 107, 181, 0.15)",
                            borderWidth: 3,
                            tension: 0.35,
                            pointRadius: 3,
                            pointBackgroundColor: "#ffb0d8",
                            pointBorderColor: "#ff6bb5",
                            fill: true
                        }]
                    },

                    options: chartOptions("Network", 500)
                }
            );
        }


        /* ================= LOAD METRICS ================= */

        async function loadMetrics() {

            try {

                const response =
                    await fetch(API + "/metrics/current");

                const data =
                    await response.json();

                const metrics =
                    data.metrics || data;

                const time =
                    new Date().toLocaleTimeString();

                const cpu =
                    Number(metrics.cpu || 0);

                const memory =
                    Number(metrics.memory || 0);

                const disk =
                    Number(metrics.disk || 0);

                const latency =
                    Number(metrics.latency || 0);


                labels.push(time);

                cpuData.push(cpu);
                memoryData.push(memory);
                diskData.push(disk);
                networkData.push(latency);


                /* Keep only last 20 points */

                if (labels.length > 20) {

                    labels.shift();

                    cpuData.shift();
                    memoryData.shift();
                    diskData.shift();
                    networkData.shift();

                }


                updateCharts();

            }

            catch (error) {

                console.log(
                    "Unable to load metrics:",
                    error
                );

            }
        }


        /* ================= UPDATE CHARTS ================= */

        function updateCharts() {

            if (!cpuChart) return;


            cpuChart.data.labels = labels;

            cpuChart.data.datasets[0].data =
                cpuData;

            cpuChart.update("none");


            memoryChart.data.labels =
                labels;

            memoryChart.data.datasets[0].data =
                memoryData;

            memoryChart.update("none");


            diskChart.data.labels =
                labels;

            diskChart.data.datasets[0].data =
                diskData;

            diskChart.update("none");


            networkChart.data.labels =
                labels;

            networkChart.data.datasets[0].data =
                networkData;

            networkChart.update("none");
        }


        /* ================= START ================= */

        createCharts();

        loadMetrics();

        setInterval(
            loadMetrics,
            3000
        );

    </script>

</body>
</html>
